<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game Night</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1140">
<link rel="apple-touch-icon" href="ocean/icon-180.png">
<link rel="icon" type="image/png" href="ocean/icon-180.png">
<style>
  :root { --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; font-family: var(--font); color: #fff; }
  body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) calc(env(safe-area-inset-right, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 20px) calc(env(safe-area-inset-left, 0px) + 18px);
    background: radial-gradient(ellipse at 30% 20%, #4b2a9c, transparent 60%), radial-gradient(ellipse at 80% 90%, #0c6fa8, transparent 55%), #1b1140; overflow-x: hidden; }
  h1 { margin: 0; font-size: clamp(26px, 6.5vw, 44px); font-weight: 900; text-align: center; line-height: 1.05; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); }
  h1 small { display: block; font-size: 0.42em; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #ffd84a; margin-bottom: 6px; }
  .games { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 760px; }
  a.game { flex: 1 1 260px; max-width: 360px; text-decoration: none; color: #fff; border-radius: 28px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
    border: 3px solid rgba(255, 255, 255, 0.35); box-shadow: 0 8px 0 rgba(0, 0, 0, 0.35), 0 20px 40px rgba(0, 0, 0, 0.35); transition: transform 0.12s; animation: rise 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) backwards; }
  a.game:nth-child(2) { animation-delay: 0.1s; }
  a.game:active { transform: translateY(5px) scale(0.98); }
  @keyframes rise { from { transform: translateY(40px) scale(0.9); opacity: 0; } }
  .ocean { background: linear-gradient(180deg, #2bb7e6, #0b5c9c); }
  .sluggy { background: linear-gradient(180deg, #7ed957, #2f8f3a); }
  .game img { width: min(46vw, 170px); aspect-ratio: 1; border-radius: 26px; border: 3px solid rgba(255, 255, 255, 0.7); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); animation: bob 3.5s ease-in-out infinite; }
  .sluggy img { animation-delay: -1.7s; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(1.5deg); } }
  .game b { font-size: 27px; font-weight: 900; line-height: 1; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); }
  .game span { font-size: 14px; font-weight: 700; opacity: 0.95; line-height: 1.3; }
  .game i { font-style: normal; font-size: 12px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; background: rgba(0, 0, 0, 0.25); padding: 4px 11px; border-radius: 999px; }
  .play { margin-top: 2px; background: #ffd84a; color: #4d2500; font-weight: 900; font-size: 18px; padding: 9px 30px; border-radius: 999px; box-shadow: 0 4px 0 #a85a00; }
  .col { display: contents; }
  @media (max-width: 700px), (max-height: 520px) {
    body { gap: 16px; }
    a.game { flex: 1 1 100%; max-width: 520px; flex-direction: row; text-align: left; padding: 14px; gap: 14px; }
    .game img { width: min(32vw, 124px); border-radius: 20px; flex: none; }
    .col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
    .game b { font-size: 23px; } .game span { font-size: 13px; } .game i { font-size: 10.5px; } .play { font-size: 16px; padding: 7px 24px; }
  }
  @media (orientation: landscape) and (max-height: 520px) { .games { flex-wrap: nowrap; } a.game { flex: 1 1 0; } .game img { width: 96px; } .game span { display: none; } }
</style>
</head>
<body>
  <h1><small>Game Night</small>Which game do you want to play?</h1>
  <div class="games">
    <a class="game ocean" href="ocean/">
      <img src="ocean/icon-512.png" alt="">
      <div class="col"><b>Ocean Game</b><span>King of the Ocean — steal the crown and rule the reef as a sawfish.</span><i>Action · 1–4 players</i><div class="play">Play</div></div>
    </a>
    <a class="game sluggy" href="sluggy/">
      <img src="sluggy/icon-512.png" alt="">
      <div class="col"><b>Sluggy's Business</b><span>Outbid the worms and build a garden empire. It's pronounced “bidness.”</span><i>Strategy · 1–2 players</i><div class="play">Play</div></div>
    </a>
  </div>
</body>
</html>
